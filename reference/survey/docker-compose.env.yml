services:
  db:
    image: mysql:8.4
    container_name: survey-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dynamic_survey
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20
  api:
    build: ./survey-api
    image: survey-api:${SURVEY_VERSION}
    container_name: survey-api
    depends_on:
      db: { condition: service_healthy }
    environment:
      TZ: Asia/Taipei
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dynamic_survey
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 10
      start_period: 30s
  web:
    build: ./survey-web
    image: survey-web:${SURVEY_VERSION}
    container_name: survey-web
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:80"]
volumes:
  db-data:
